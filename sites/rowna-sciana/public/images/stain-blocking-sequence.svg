<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="600" viewBox="0 0 1536 600"><rect width="1536" height="600" fill="#f3f1e7"/><g fill="#fffef8" stroke="#d9ddcc" stroke-width="2"><rect x="42" y="45" width="460" height="500" rx="12"/><rect x="538" y="45" width="460" height="500" rx="12"/><rect x="1034" y="45" width="460" height="500" rx="12"/></g><g font-family="Arial,sans-serif" fill="#314d41"><text x="78" y="112" font-size="24">01 / ROZPOZNANIE</text><text x="574" y="112" font-size="24">02 / DOKUMENTACJA</text><text x="1070" y="112" font-size="24">03 / PRÓBA</text><g font-size="35"><text x="78" y="185">Ustal stan ściany</text><text x="574" y="185">Porównaj instrukcje</text><text x="1070" y="185">Oceń mały fragment</text></g><g font-size="25"><text x="78" y="265">Najpierw przyczyna</text><text x="78" y="310">i przygotowanie podłoża.</text><text x="574" y="265">Podłoże, warstwy,</text><text x="574" y="310">przerwy i wykończenie.</text><text x="1070" y="265">Cały zestaw po</text><text x="1070" y="310">wymaganym wyschnięciu.</text></g><text x="78" y="425" font-size="22">Schemat, nie diagnoza.</text><text x="574" y="425" font-size="22">Bez rankingu produktów.</text><text x="1070" y="425" font-size="22">Bez gwarancji trwałości.</text></g></svg>
