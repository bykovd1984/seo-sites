<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="405" viewBox="0 0 1000 405" role="img" aria-labelledby="title desc"><title id="title">Krycie a wydajność farby</title><desc id="desc">Krycie oznacza zasłanianie barwy podłoża; wydajność opisuje powierzchnię przy określonym sposobie malowania. To schemat, nie wynik testu produktu.</desc><rect width="1000" height="405" fill="#faf7f0"/><g transform="translate(25,30)"><rect width="460" height="275" fill="#f6f1e8"/><rect x="25" y="42" width="190" height="184" rx="3" fill="#728b9d"/><path d="M25 42H120V134H25ZM120 134H215V226H120Z" fill="#d1bba0"/><rect x="25" y="42" width="190" height="184" rx="3" fill="#fffdf7" opacity=".55"/><rect x="245" y="42" width="190" height="184" rx="3" fill="#fffdf7" stroke="#dbd3c5" stroke-width="2"/><path d="M229 105V163M223 134H235" stroke="#758371" stroke-width="2"/>
<text x="25" y="310" font-family="Arial,sans-serif" font-size="26" fill="#183b30">Krycie: czy widać stary kolor?</text></g><g transform="translate(515,30)"><rect width="460" height="275" fill="#f6f1e8"/><rect x="50" y="35" width="360" height="195" rx="3" fill="#b6c1a7" stroke="#708367" stroke-width="2"/><path d="M140 35V230M230 35V230M320 35V230M50 100H410M50 165H410" fill="none" stroke="#f9f6ec" stroke-width="3"/><path d="M50 248H410M50 241V255M410 241V255" fill="none" stroke="#708367" stroke-width="2"/>
<text x="25" y="310" font-family="Arial,sans-serif" font-size="26" fill="#183b30">Wydajność: powierzchnia z litra</text></g><text x="50" y="385" font-family="Arial,sans-serif" font-size="18" fill="#56614d">Schemat pojęć. Nie określa liczby warstw ani wydajności konkretnej farby.</text></svg>
