services:
  rowna-sciana:
    image: ${SITE_IMAGE:-seo-rowna-sciana:latest}
    container_name: seo-rowna-sciana
    restart: unless-stopped
    ports:
      - "127.0.0.1:5005:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
