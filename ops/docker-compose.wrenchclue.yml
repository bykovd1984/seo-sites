services:
  wrenchclue:
    image: ${SITE_IMAGE:-seo-wrenchclue:latest}
    container_name: seo-wrenchclue
    restart: unless-stopped
    ports:
      - "127.0.0.1:5010:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
