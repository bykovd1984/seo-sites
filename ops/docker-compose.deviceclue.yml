services:
  deviceclue:
    image: ${SITE_IMAGE:-seo-deviceclue:latest}
    container_name: seo-deviceclue
    restart: unless-stopped
    ports:
      - "127.0.0.1:5006:3000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    environment:
      DEVICECLUE_LOG_ENDPOINT: http://deviceclue-elasticsearch:9200
      DEVICECLUE_LOG_KEY_FILE: /run/secrets/elasticsearch-api-key
    secrets:
      - elasticsearch-api-key
    networks:
      - default
      - deviceclue-logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  elasticsearch-api-key:
    file: /opt/seo-sites/deviceclue/secrets/elasticsearch-api-key
networks:
  deviceclue-logs:
    external: true
